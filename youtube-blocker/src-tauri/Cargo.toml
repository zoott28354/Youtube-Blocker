[package]
name = "youtube-blocker"
version = "1.2.2"
edition = "2021"
authors = ["zoott28354"]
description = "App per bloccare siti web a livello di sistema con focus Windows e v1 macOS hosts-only"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
dirs = "5"
thiserror = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
